name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test scripts/*.test.mjs

      - name: Build Next.js app (staging check)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.jujuy247.com.ar
          NEXT_PUBLIC_DIRECTUS_URL: https://directus-production-244d.up.railway.app
          NEXT_PUBLIC_APP_ENV: staging
